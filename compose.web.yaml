# Paths are relative to the first Compose file: case-finder-main/server/docker-compose.yml.
services:
  api:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5).close()"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ../../web
    environment:
      HOST: 0.0.0.0
      PORT: "4173"
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:4173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 5s
    restart: unless-stopped
